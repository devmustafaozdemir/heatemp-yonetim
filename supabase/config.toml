# Supabase CLI yerel geliştirme yapılandırması (supabase start / supabase db reset).
# Yalnızca bu uygulamanın ihtiyaç duyduğu ayarlar yazılmıştır; diğerleri CLI varsayılanıdır.
project_id = "heatemp-yonetim"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Tek firma kullanımı: herkese açık kayıt kapalı; kullanıcılar Studio/Dashboard'dan eklenir.
enable_signup = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
