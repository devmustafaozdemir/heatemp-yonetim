# Supabase CLI kullanılamayan ortamlar için asgari yerel Supabase yığını
# (Postgres + GoTrue + PostgREST + isteğe bağlı Storage + nginx ağ geçidi).
# Önerilen yol Supabase CLI'dır (`supabase start`); bu dosya CLI'ın portlarını
# taklit eder: API http://127.0.0.1:54321, veritabanı 127.0.0.1:54322.
# Başlatmak için: bash scripts/dev-stack/up.sh
name: heatemp-dev

x-jwt: &jwt_secret super-secret-jwt-token-with-at-least-32-characters-long

services:
  db:
    image: supabase/postgres:15.8.1.085
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 40

  auth:
    image: supabase/gotrue:v2.177.0
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: *jwt_secret
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

  rest:
    image: postgrest/postgrest:v12.2.12
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt_secret
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_CHANNEL_ENABLED: "true"

  storage:
    image: supabase/storage-api:v1.25.7
    profiles: ["storage"]
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    restart: on-failure
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: *jwt_secret
      DATABASE_URL: postgres://supabase_storage_admin:postgres@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"

  gateway:
    image: nginx:1.27-alpine
    depends_on: [auth, rest]
    ports:
      - "54321:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
